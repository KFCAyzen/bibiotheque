services:

  # ---------------------------------------------------------------------------
  # Base de données PostgreSQL
  # ---------------------------------------------------------------------------
  # application.properties reste figé sur MySQL (l'épreuve interdit d'y toucher).
  # Rien n'est perdu : tous ses paramètres de connexion sont surchargés plus bas
  # par variables d'environnement, dialecte Hibernate compris.
  #
  # Le schéma ne s'appelle pas « bibliotheque » par hasard : POSTGRES_DB le crée
  # au premier démarrage, exactement comme MYSQL_DATABASE le faisait avant.
  # ---------------------------------------------------------------------------
  db:
    image: postgres:15-alpine
    container_name: bibliotheque-db
    restart: unless-stopped
    environment:
      # Aucun mot de passe en dur : surchargeable via un fichier .env
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-bibliotheque}
    ports:
      # Exposé sur l'hôte pour pouvoir inspecter la base depuis un client externe
      - "5432:5432"
    volumes:
      # Volume nommé : les données survivent à "docker compose down" (barème 3.1).
      # Le point de montage change avec le moteur : PostgreSQL stocke son cluster
      # dans /var/lib/postgresql/data, là où MySQL utilisait /var/lib/mysql.
      - db-data:/var/lib/postgresql/data
    healthcheck:
      # "depends_on" seul n'attend que le démarrage du conteneur, pas la
      # disponibilité du serveur. C'est ce healthcheck qui fera la différence
      # quand le backend viendra s'y accrocher (barème 3.4).
      #
      # pg_isready est l'équivalent de mysqladmin ping. On lui passe l'utilisateur
      # ET la base : sans -d, il interroge la base "postgres" et peut répondre
      # vert avant que "bibliotheque" ne soit disponible.
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  # ---------------------------------------------------------------------------
  # API Spring Boot
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./bibliotheque-backend
    container_name: bibliotheque-backend
    restart: unless-stopped
    environment:
      # application.properties est intouchable (contrainte de l'épreuve).
      # Spring Boot applique la "relaxed binding" : SPRING_DATASOURCE_URL
      # surcharge spring.datasource.url. C'est ainsi qu'on repointe la base
      # sans éditer une seule ligne du fichier de configuration.
      #
      # "db" et non "localhost" : dans le réseau Docker, chaque service est
      # joignable par son nom. localhost, ici, désignerait le conteneur backend
      # lui-même.
      #
      # L'URL JDBC perd les paramètres MySQL (useSSL, allowPublicKeyRetrieval,
      # serverTimezone) : ils n'existent pas côté PostgreSQL, dont le pilote se
      # connecte en clair sur un réseau Docker privé et lit le fuseau du serveur.
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-bibliotheque}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      # LA variable qu'on oublie. application.properties fige
      # spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL5InnoDBDialect.
      # Sans cette surcharge, Hibernate génère du DDL et du SQL MySQL contre un
      # serveur PostgreSQL : le démarrage échoue dès la création du schéma.
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQL95Dialect
    ports:
      - "8080:8080"
    depends_on:
      db:
        # La clé du barème 3.4 : on n'attend pas le démarrage du conteneur db,
        # on attend que son healthcheck passe au vert. Sans "condition",
        # le backend démarrerait trop tôt et mourrait sur un refus de connexion.
        condition: service_healthy
    healthcheck:
      # Tomcat n'ouvre son port qu'après l'initialisation de JPA : obtenir une
      # réponse HTTP prouve donc que les tables ont été créées par Hibernate.
      # C'est ce qui permet au service "seed" de savoir quand il peut écrire.
      # Le 401 attendu ici n'est pas un échec : seul compte le fait qu'une
      # réponse arrive, d'où l'absence de -f.
      test: ["CMD-SHELL", "curl -s -o /dev/null http://127.0.0.1:8080/admin/books || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Interface Angular, servie par nginx
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./bibliotheque-frontend
    container_name: bibliotheque-frontend
    restart: unless-stopped
    ports:
      # Le piège de l'énoncé : le front appelle http://localhost:8080 en dur,
      # mais ce code tourne dans le navigateur de l'utilisateur, pas dans ce
      # conteneur. "localhost" y désigne donc la machine hôte — où le port 8080
      # du backend est publié juste au-dessus. Aucun proxy n'est nécessaire.
      # En revanche, si le front avait appelé l'API depuis le conteneur (SSR),
      # il aurait fallu viser http://backend:8080.
      - "4200:4200"
    depends_on:
      - backend

  # ---------------------------------------------------------------------------
  # Jeu de données initial — service à usage unique
  # ---------------------------------------------------------------------------
  # Objectif : qu'un "docker compose up" sur une machine vierge donne une
  # application immédiatement utilisable, sans le moindre SQL tapé à la main.
  #
  # Il ne peut pas s'exécuter plus tôt : les tables n'existent qu'une fois
  # Hibernate passé, donc une fois le backend démarré. D'où la dépendance au
  # healthcheck du backend, et non à celui de la base. La remarque vaut tout
  # autant sous PostgreSQL, dont le point d'entrée /docker-entrypoint-initdb.d
  # ne joue ses scripts qu'à l'initialisation du volume — soit avant le backend.
  #
  # Le conteneur s'arrête dès le script terminé : le voir en statut "Exited (0)"
  # dans "docker compose ps" est le comportement normal, pas une panne.
  # ---------------------------------------------------------------------------
  seed:
    # Même image que la base : elle embarque le client psql.
    image: postgres:15-alpine
    container_name: bibliotheque-seed
    restart: "no"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      # psql lit ces variables de lui-même : la ligne de commande reste nue.
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-postgres}
      # psql ne demande jamais de mot de passe sur une entrée non interactive :
      # PGPASSWORD est le seul canal qui lui en fournisse un.
      PGPASSWORD: ${POSTGRES_PASSWORD:-postgres}
      PGDATABASE: ${POSTGRES_DB:-bibliotheque}
      # L'équivalent du --default-character-set=utf8mb4 de l'ancien client mysql :
      # sans lui, les accents du jeu de données sont réinterprétés dans
      # l'encodage de l'environnement et arrivent doublement encodés en base.
      PGCLIENTENCODING: UTF8
    volumes:
      - ./docker/seed.sql:/seed.sql:ro
    # ON_ERROR_STOP=1 : par défaut psql poursuit après une erreur et sort en 0.
    # Un seed à moitié appliqué passerait alors pour un succès.
    command: >
      sh -c 'psql -v ON_ERROR_STOP=1 -f /seed.sql
      && echo "[seed] jeu de donnees initial applique"'

  # ---------------------------------------------------------------------------
  # Documentation interactive de l'API
  # ---------------------------------------------------------------------------
  # Le projet n'embarque aucune dépendance springdoc/springfox, et pom.xml est
  # intouchable. On sert donc une spécification OpenAPI écrite à la main via
  # l'image officielle swagger-ui : la documentation devient navigable et
  # testable sans modifier une ligne du backend.
  #
  # Le bouton "Try it out" tape sur http://localhost:8080 depuis le navigateur.
  # Cela fonctionne parce que CorsConfiguration autorise toutes les origines —
  # vérifié : le préflight depuis :8081 renvoie bien
  # Access-Control-Allow-Origin: http://localhost:8081.
  # ---------------------------------------------------------------------------
  swagger:
    image: swaggerapi/swagger-ui
    container_name: bibliotheque-swagger
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      SWAGGER_JSON: /spec/openapi.yaml
    volumes:
      - ./docker/openapi.yaml:/spec/openapi.yaml:ro

volumes:
  db-data:
