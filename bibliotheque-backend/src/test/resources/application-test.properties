# =============================================================================
# Profil « test » — activé par @ActiveProfiles("test") sur les tests Spring.
# -----------------------------------------------------------------------------
# application.properties est figé depuis la séance 1 sur une URL MySQL dont le
# pilote n'est même plus dans le classpath. En production, docker-compose.yml le
# neutralise par variables d'environnement ; « mvn test » lancé seul ne les a
# pas. Ce fichier joue le même rôle pour les tests : il vise le conteneur
# PostgreSQL du projet, publié sur le port 5432 de l'hôte.
#
#   docker compose up -d db      puis      ./mvnw test
#
# Les valeurs par défaut sont celles de docker-compose.yml ; les mêmes variables
# POSTGRES_* (ou SPRING_DATASOURCE_URL) les surchargent, par exemple pour viser
# « db » plutôt que « localhost » quand Maven tourne lui-même dans un conteneur.
#
# Les tests d'intégration s'exécutent dans une transaction annulée à la fin de
# chaque méthode : ils ne laissent rien dans la base.
# =============================================================================
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:5432/${POSTGRES_DB:bibliotheque}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:postgres}

# LA ligne qu'on oublie (voir docker-compose.yml) : sans elle, Hibernate parle
# MySQL à un serveur PostgreSQL.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQL95Dialect

# Le bruit SQL n'apporte rien dans une sortie de tests.
spring.jpa.show-sql=false
