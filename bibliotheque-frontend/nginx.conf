server {
    # Le sujet impose l'interface sur le port 4200 : c'est nginx qui l'écoute
    # ici, et non "ng serve", qui est un serveur de développement.
    listen 4200;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Angular est une application à page unique : le routage vit dans le
    # navigateur, pas sur le serveur. Sans cette ligne, recharger /books
    # renverrait un 404, car aucun fichier "books" n'existe sur le disque.
    # On sert index.html et on laisse le Router Angular décider.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
